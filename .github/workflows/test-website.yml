# ============================================================================
# Test a website — Actions → "Test a website" → Run workflow.
#   1. Type the domain (a saved one, or a new one: it's added to the list).
#   2. Optionally tick "Fix" to have problems fixed in the site's code.
# Results: this run's summary page, SITES.md, and reports/<domain>/ in this repository.
#
# How a fix run stays safe — the website's own code (its build, its libraries) and Claude
# only ever run in jobs that hold no key able to change anything:
#   fix      builds the site, applies the built-in fixes and Claude's fixes (each re-tested,
#            undone if it doesn't help), and hands over the changes as a patch. Read-only.
#   verify   a fresh machine applies the patch and runs the final test against the "before"
#            result saved before any fix was made. Read-only.
#   publish  runs no website code: applies the patch, pushes a branch, opens a draft pull
#            request (only if verify found no new serious issue), and saves the reports.
# ============================================================================
name: Test a website
run-name: "Test ${{ inputs.website }}${{ inputs.fix && ' and fix' || '' }}"

on:
  workflow_dispatch:
    inputs:
      website:
        description: "Website to test: its domain, e.g. tours.mw.photography (new ones are added to the list)"
        required: true
        type: string
      depth:
        description: "How thorough"
        type: choice
        default: "Full: every browser and screen size (about 10 minutes)"
        options:
          - "Full: every browser and screen size (about 10 minutes)"
          - "Quick: Chrome, 3 screen sizes (about 3 minutes)"
      fix:
        description: "Fix what can be fixed safely, re-test, and open a pull request with the fixes (needs the code repository)"
        type: boolean
        default: false
      code_repository:
        description: "Code repository of this website, as owner/name (saved with the site; leave empty to keep the saved one)"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: site-${{ inputs.website }}
  cancel-in-progress: false

jobs:
  test:
    name: Test the live website
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: write   # to save the site list and the reports
    outputs:
      domain: ${{ steps.site.outputs.domain }}
      repo: ${{ steps.site.outputs.repo }}
    steps:
      - uses: actions/checkout@v7

      - name: Install the test tools
        env:
          QUICK: ${{ startsWith(inputs.depth, 'Quick') }}
        run: |
          npm ci --prefix qa --no-audit --no-fund
          cd qa && if [ "$QUICK" = "true" ]; then npx playwright install --with-deps chromium; else npx playwright install --with-deps chromium firefox webkit; fi

      - name: Find or add the website
        id: site
        env:
          WEBSITE: ${{ inputs.website }}
          REPO_INPUT: ${{ inputs.code_repository }}
        run: |
          domain=$(node --input-type=module -e "import {normalizeDomain} from './qa/lib/config.mjs'; console.log(normalizeDomain(process.env.WEBSITE))")
          if [ ! -f "sites/$domain.json" ] || [ -n "$REPO_INPUT" ]; then
            node qa/site.mjs save --domain "$domain" --repo "$REPO_INPUT"
          fi
          echo "domain=$domain" >> "$GITHUB_OUTPUT"
          echo "repo=$(jq -r '.repo // ""' "sites/$domain.json")" >> "$GITHUB_OUTPUT"

      - name: Test the website
        id: qa
        continue-on-error: true
        env:
          DOMAIN: ${{ steps.site.outputs.domain }}
          QUICK: ${{ startsWith(inputs.depth, 'Quick') }}
        run: |
          extra=(); [ "$QUICK" = "true" ] && extra+=(--quick)
          node qa/run.mjs --site "$DOMAIN" --out "reports/$DOMAIN/latest" "${extra[@]}"

      - name: Show the results on this page
        if: always()
        env:
          DOMAIN: ${{ steps.site.outputs.domain }}
        run: |
          f="reports/$DOMAIN/latest"
          if [ -f "$f/summary.md" ]; then cat "$f/summary.md" "$f/details.md" | sed 's/<!-- qa-results:.*-->//' >> "$GITHUB_STEP_SUMMARY"
          else echo "The test stopped before writing a report. Open the 'Test the website' step to see why." >> "$GITHUB_STEP_SUMMARY"; fi

      - name: Attach the full report (with screenshots)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: report-${{ steps.site.outputs.domain }}
          path: reports/${{ steps.site.outputs.domain }}/latest/
          retention-days: 90
          if-no-files-found: ignore

      - name: Save the results in this repository
        if: always() && steps.site.outputs.domain != ''
        env:
          DOMAIN: ${{ steps.site.outputs.domain }}
        run: |
          d="reports/$DOMAIN"
          if [ -f "$d/latest/results.json" ]; then
            stamp=$(date -u +%Y-%m-%d_%H%M)
            mkdir -p "$d/history/$stamp" && cp "$d/latest/"{results.json,summary.md,details.md} "$d/history/$stamp/"
          fi
          node qa/site.mjs index
          .github/scripts/save.sh "Test results for $DOMAIN" sites SITES.md "$d"

      - name: Mark the run as failed if there are serious issues
        if: steps.qa.outcome == 'failure'
        run: |
          echo "::error::Serious issues that aren't on this site's known list (or the test couldn't finish). See the summary above."
          exit 1

  fix:
    name: Fix and re-test each fix (no write access)
    needs: test
    if: inputs.fix && !cancelled() && needs.test.outputs.domain != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      contents: read
    outputs:
      ready: ${{ steps.ready.outputs.ok }}
    env:
      DOMAIN: ${{ needs.test.outputs.domain }}
      REPO: ${{ needs.test.outputs.repo }}
    steps:
      - name: Check what fixing needs
        id: ready
        env:
          HAS_SITES_TOKEN: ${{ secrets.SITES_TOKEN != '' }}
          HAS_ANTHROPIC: ${{ secrets.ANTHROPIC_API_KEY != '' }}
        run: |
          ok=true
          if [ -z "$REPO" ]; then
            echo "### Can't fix $DOMAIN yet" >> "$GITHUB_STEP_SUMMARY"
            echo "Fixes are made in the website's code, and no code repository is saved for it. Run this form again with **Code repository** filled in (owner/name)." >> "$GITHUB_STEP_SUMMARY"; ok=false
          fi
          if [ "$HAS_SITES_TOKEN" != "true" ]; then
            echo "### Missing key: SITES_TOKEN" >> "$GITHUB_STEP_SUMMARY"
            echo "A GitHub key that can read your sites' code and open pull requests there. See README → Setup." >> "$GITHUB_STEP_SUMMARY"; ok=false
          fi
          [ "$HAS_ANTHROPIC" != "true" ] && echo "No ANTHROPIC_API_KEY: only the built-in fixes will run (see README → Setup)." >> "$GITHUB_STEP_SUMMARY"
          echo "ok=$ok" >> "$GITHUB_OUTPUT"
          echo "claude=$HAS_ANTHROPIC" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v7
        if: steps.ready.outputs.ok == 'true'
        with:
          ref: ${{ github.ref_name }}   # the latest site list, including a site the test job just added
          persist-credentials: false

      - name: Get the website's code
        if: steps.ready.outputs.ok == 'true'
        uses: actions/checkout@v7
        with:
          repository: ${{ needs.test.outputs.repo }}
          token: ${{ secrets.SITES_TOKEN }}   # used only to download; not kept on disk
          path: site
          persist-credentials: false

      - name: Install the test tools
        if: steps.ready.outputs.ok == 'true'
        run: |
          npm ci --prefix qa --no-audit --no-fund
          cd qa && npx playwright install --with-deps chromium
          git -C site config user.name "site-qa[bot]"; git -C site config user.email "site-qa-bot@users.noreply.github.com"
          mkdir -p work && git -C site rev-parse HEAD > work/start-sha
          # The site's build output is never part of a fix.
          out=$(jq -r 'if .build then (.serveDir // "") else "" end' "sites/$DOMAIN.json" | sed 's#^\./##; s#/$##')
          if [ -n "$out" ] && [ "$out" != "." ]; then echo "/$out/" >> site/.git/info/exclude; fi

      - name: Test the code before fixing
        if: steps.ready.outputs.ok == 'true'
        run: |
          node qa/run.mjs --site "$DOMAIN" --root site --quick --with-perf --out work/before || true
          if [ ! -f work/before/results.json ]; then echo "### The site's code couldn't be tested (see this step), so nothing was fixed." >> "$GITHUB_STEP_SUMMARY"; exit 1; fi

      - name: Keep the "before" result safe from the fix steps
        if: steps.ready.outputs.ok == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: before-${{ needs.test.outputs.domain }}
          path: |
            work/before/results.json
            work/start-sha
          retention-days: 30

      - name: Built-in fixes (each one re-tested, undone if it doesn't help)
        if: steps.ready.outputs.ok == 'true'
        run: node qa/fix.mjs --site "$DOMAIN" --root site --results work/before/results.json --log work/fixes.json --commit

      - name: Test again and write Claude's task
        id: task
        if: steps.ready.outputs.ok == 'true'
        run: |
          node qa/run.mjs --site "$DOMAIN" --root site --quick --with-perf --out work/mid || true
          if [ -f work/mid/results.json ]; then
            node qa/claude-task.mjs --site "$DOMAIN" --results work/mid/results.json --site-dir site --log work/fixes.json > qa-task.md
            echo "count=$(grep -c '^### ' qa-task.md || true)" >> "$GITHUB_OUTPUT"
          else echo "count=0" >> "$GITHUB_OUTPUT"; fi

      - name: Claude fixes the rest (each one re-tested, undone if it doesn't help)
        if: steps.ready.outputs.ok == 'true' && steps.ready.outputs.claude == 'true' && steps.task.outputs.count != '0'
        continue-on-error: true
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ github.token }}   # read-only in this job
          prompt: "Follow the instructions in qa-task.md exactly, from start to finish."
          claude_args: |
            --max-turns 250
            --allowedTools "Read,Write,Edit,MultiEdit,Glob,Grep,LS,Bash(node:*),Bash(npm:*),Bash(npx:*),Bash(python3:*),Bash(git -C site status:*),Bash(git -C site diff:*),Bash(git -C site log:*),Bash(git -C site add:*),Bash(git -C site commit:*),Bash(git -C site reset --hard:*),Bash(git -C site clean -fd:*),Bash(ls:*),Bash(cat:*),Bash(jq:*),Bash(mkdir:*)"

      - name: Hand over the fixes as a patch
        if: always() && steps.ready.outputs.ok == 'true'
        run: |
          # Unfinished attempts are dropped: only re-tested, committed fixes are handed over.
          git -C site reset -q --hard && git -C site clean -qfd
          git -C site format-patch -q --binary -o "$PWD/work/patch" "$(cat work/start-sha)..HEAD"
          echo "Fixes kept: $(ls work/patch | wc -l) commit(s)." >> "$GITHUB_STEP_SUMMARY"
          [ -f work/fixes.json ] || echo "[]" > work/fixes.json
          [ -f qa-task.md ] && cp qa-task.md work/ || true

      - name: Attach the fixes
        if: always() && steps.ready.outputs.ok == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: fixes-${{ needs.test.outputs.domain }}
          path: |
            work/patch/
            work/fixes.json
            work/qa-task.md
            work/mid/results.json
          retention-days: 90
          if-no-files-found: warn

  verify:
    name: Final test on a fresh machine (no write access)
    needs: [test, fix]
    if: needs.fix.result == 'success' && needs.fix.outputs.ready == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
    env:
      DOMAIN: ${{ needs.test.outputs.domain }}
    outputs:
      added: ${{ steps.final.outputs.added }}
      changed: ${{ steps.final.outputs.changed }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}
          persist-credentials: false

      - uses: actions/download-artifact@v8
        with:
          name: before-${{ needs.test.outputs.domain }}
          path: work

      - uses: actions/download-artifact@v8
        with:
          name: fixes-${{ needs.test.outputs.domain }}
          path: work

      - name: Get the website's code as it was before
        uses: actions/checkout@v7
        with:
          repository: ${{ needs.test.outputs.repo }}
          token: ${{ secrets.SITES_TOKEN }}
          path: site
          persist-credentials: false
          fetch-depth: 0

      - name: Apply the fixes
        id: apply
        run: |
          git -C site config user.name "site-qa[bot]"; git -C site config user.email "site-qa-bot@users.noreply.github.com"
          git -C site checkout -q "$(cat work/start-sha)"
          n=$(ls work/patch 2>/dev/null | wc -l)
          if [ "$n" -gt 0 ]; then git -C site -c core.hooksPath=/dev/null am -q work/patch/*.patch; fi
          echo "changed=$n" >> "$GITHUB_OUTPUT"

      - name: Install the test tools
        run: |
          npm ci --prefix qa --no-audit --no-fund
          cd qa && npx playwright install --with-deps chromium

      - name: Final test, compared with before
        id: final
        env:
          CHANGED: ${{ steps.apply.outputs.changed }}
        run: |
          node qa/run.mjs --site "$DOMAIN" --root site --quick --with-perf --compare work/before/results.json --fixes work/fixes.json --out work/after || true
          if [ ! -f work/after/results.json ]; then
            echo "### The final test couldn't finish, so no pull request is opened. See this step." >> "$GITHUB_STEP_SUMMARY"
            echo "added=unknown" >> "$GITHUB_OUTPUT"; echo "changed=$CHANGED" >> "$GITHUB_OUTPUT"; exit 0
          fi
          added=$(jq '[(.comparison.added // [])[] | select(.severity == "Critical" or .severity == "High")] | length' work/after/results.json)
          echo "added=$added" >> "$GITHUB_OUTPUT"; echo "changed=$CHANGED" >> "$GITHUB_OUTPUT"
          sed 's/<!-- qa-results:.*-->//' work/after/summary.md work/after/details.md >> "$GITHUB_STEP_SUMMARY"

      - name: Attach the final report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: after-${{ needs.test.outputs.domain }}
          path: work/after/
          retention-days: 90
          if-no-files-found: ignore

  publish:
    name: Open the pull request and save the reports
    needs: [test, fix, verify]
    if: always() && needs.verify.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write   # to save the reports in this repository
    env:
      DOMAIN: ${{ needs.test.outputs.domain }}
      REPO: ${{ needs.test.outputs.repo }}
      ADDED: ${{ needs.verify.outputs.added }}
      CHANGED: ${{ needs.verify.outputs.changed }}
    steps:
      # This job never runs the website's code or installs its libraries.
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}

      - uses: actions/download-artifact@v8
        with:
          pattern: "{before,fixes,after}-${{ needs.test.outputs.domain }}"
          merge-multiple: true
          path: work

      - name: Open a draft pull request with the fixes
        if: env.CHANGED != '0'
        env:
          GH_TOKEN: ${{ secrets.SITES_TOKEN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          RUN_ID: ${{ github.run_id }}
        run: |
          if [ "$ADDED" != "0" ]; then
            echo "### No pull request: the final test found ${ADDED} new serious issue(s) after the fixes" >> "$GITHUB_STEP_SUMMARY"
            echo "Nothing was changed in the website's code. The report lists what happened." >> "$GITHUB_STEP_SUMMARY"; exit 0
          fi
          git clone -q --filter=blob:none --no-checkout "https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git" site
          cd site
          git config core.hooksPath /dev/null
          git config user.name "site-qa[bot]"; git config user.email "site-qa-bot@users.noreply.github.com"
          branch="qa-fixes/$(date -u +%Y-%m-%d)-run-${RUN_ID}"
          git checkout -q -b "$branch" "$(cat ../work/start-sha)"
          git am -q ../work/patch/*.patch
          git push -q origin "$branch"
          base=$(gh api "repos/$REPO" --jq .default_branch)
          { echo "Automatic fixes from **Test a website**. Every change was re-tested on the affected pages, and the whole set was tested again on a fresh machine. Changes that didn't fix the problem or caused a new one were undone."
            echo; echo "**Before merging:** check the pages in a preview, and review any wording marked \"wording to review\" (titles, descriptions, image descriptions)."
            echo; echo "Full run: $RUN_URL"; echo
            sed 's/<!-- qa-results:.*-->//' ../work/summary.md ../work/details.md; } | head -c 60000 > ../pr.md
          url=$(gh pr create --repo "$REPO" --base "$base" --head "$branch" --draft --title "Site test fixes ($(date -u +%Y-%m-%d))" --body-file ../pr.md)
          echo "### Pull request with the fixes: $url" >> "$GITHUB_STEP_SUMMARY"

      - name: Save the fix report in this repository
        if: always()
        run: |
          [ -f work/results.json ] || exit 0
          d="reports/$DOMAIN/fixes/$(date -u +%Y-%m-%d_%H%M)"
          mkdir -p "$d" && cp work/results.json work/summary.md work/details.md work/fixes.json "$d/"
          [ -f work/qa-task.md ] && cp work/qa-task.md "$d/" || true
          .github/scripts/save.sh "Fix results for $DOMAIN" reports
